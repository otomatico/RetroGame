<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>P·bing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Canvas setup ────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;
canvas.width = W; canvas.height = H;

// ── Colores retro ───────────────────────────────────
const COL_WHITE = '#FFFFFF';
const COL_CYAN  = '#00FFFF';
const COL_MAG   = '#FF00FF';
const COL_BLACK = '#000000';

// ── Estados FSM ─────────────────────────────────────
const STATE = { BOOT: 'BOOT', MAIN_MENU: 'MAIN_MENU', GAMEPLAY: 'GAMEPLAY', GAME_OVER: 'GAME_OVER' };

let state = STATE.BOOT;
let prevState = null;

// Transiciones
function goTo(s) {
  // Exit del estado anterior
  if (state === STATE.GAMEPLAY) exitGameplay();
  state = s;
  switch (s) {
    case STATE.BOOT:            enterBoot();            break;
    case STATE.MAIN_MENU:       enterMainMenu();        break;
    case STATE.GAMEPLAY:        enterGameplay(prevState); break;
    case STATE.GAME_OVER:       enterGameOver(prevState, won); break;
  }
}

let won = null; // para GameOver

// ── Utilidades de texto centrado con doble sombra ───
function drawCentered(text, x, y, size, color, shadowColor) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Sombra cyan (desplazada arriba-izquierda)
  ctx.fillStyle = COL_CYAN;
  ctx.fillText(text, x - 3, y - 3);

  // Sombra magenta (desplazada abajo-derecha)
  ctx.fillStyle = COL_MAG;
  ctx.fillText(text, x + 3, y + 3);

  // Texto principal
  ctx.fillStyle = color || COL_WHITE;
  ctx.fillText(text, x, y);
}

function drawCenteredMultipleShadows(text, x, y, size) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Glow cyan grande
  ctx.shadowColor = COL_CYAN;
  ctx.shadowBlur = 20;
  ctx.fillText(text, x, y);

  // Glow magenta grande
  ctx.shadowColor = COL_MAG;
  ctx.shadowBlur = 20;
  ctx.fillText(text, x, y);

  // Reset glow
  ctx.shadowBlur = 0;

  // Texto blanco
  ctx.fillStyle = COL_WHITE;
  ctx.fillText(text, x, y);
}

function drawTextBelow(text, x, y, size, alpha) {
  ctx.globalAlpha = alpha;
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COL_WHITE;
  ctx.shadowColor = COL_CYAN;
  ctx.shadowBlur = 10;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ── Estado: BOOT ────────────────────────────────────
function enterBoot() {}
let bootTimer = 0;
function updateBoot(dt) {
  bootTimer += dt;
  drawScreen();
  if (bootTimer > 2000) goTo(STATE.MAIN_MENU);
}
function drawBootScreen() {
  ctx.fillStyle = COL_BLACK;
  ctx.fillRect(0, 0, W, H);
  drawCenteredMultipleShadows('Otomatico', W / 2, H / 2, 72);
}

// ── Estado: MAIN_MENU ───────────────────────────────
function enterMainMenu() {}
let menuBlinkTime = 0;
function updateMainMenu(dt) {
  drawScreen();
}
function drawMainMenuScreen() {
  ctx.fillStyle = COL_BLACK;
  ctx.fillRect(0, 0, W, H);

  // Título principal con doble sombra
  drawCenteredMultipleShadows('p·bing', W / 2, H / 2 - 40, 80);

  // Texto "Iniciar juego" abajo que hace fadeON/fadeOff cada 500ms
  menuBlinkTime += 16; // ~60fps, 500ms ≈ 30 frames
  const cyclePos = (menuBlinkTime % 1000) / 1000; // 0→1 cada 1s
  let alpha;
  if (cyclePos < 0.25) {
    // ON: 0→1
    alpha = cyclePos / 0.25;
  } else if (cyclePos < 0.5) {
    // OFF: 1→0
    alpha = 1 - (cyclePos - 0.25) / 0.25;
  } else if (cyclePos < 0.75) {
    // ON: 0→1
    alpha = (cyclePos - 0.5) / 0.25;
  } else {
    // OFF: 1→0
    alpha = 1 - (cyclePos - 0.75) / 0.25;
  }

  drawTextBelow('Iniciar juego', W / 2, H / 2 + 120, 28, Math.max(0, Math.min(1, alpha)));
}

// ── Estado: GAMEPLAY ────────────────────────────────
let paddleW = 14, paddleH = 90, paddleSpeed = 500; // px/s
let ballR = 8, ballBaseSpeed = 350;
let playerY, cpuY, ballX, ballY, ballVX, ballVY;
let playerScore, cpuScore, maxScore;
let keys = {};

function enterGameplay(fromState) {
  playerScore = 0;
  cpuScore = 0;
  maxScore = 5;
  playerY = H / 2 - paddleH / 2;
  cpuY = H / 2 - paddleH / 2;
  resetBall();
}

function exitGameplay() {}

function resetBall() {
  ballX = W / 2;
  ballY = H / 2;
  const angle = (Math.random() * Math.PI / 3) - Math.PI / 6; // -30° a +30°
  ballVX = Math.cos(angle) * ballBaseSpeed * (Math.random() < 0.5 ? 1 : -1);
  ballVY = Math.sin(angle) * ballBaseSpeed;
}

function updateGameplay(dt) {
  const ds = dt / 1000; // segundos

  // Input jugador (W/S o flechas arriba/abajo)
  if (keys['w'] || keys['arrowup'])    playerY -= paddleSpeed * ds;
  if (keys['s'] || keys['arrowdown'])   playerY += paddleSpeed * ds;
  playerY = Math.max(0, Math.min(H - paddleH, playerY));

  // IA CPU simple
  const cpuCenter = cpuY + paddleH / 2;
  const diff = ballY - cpuCenter;
  const cpuSpd = paddleSpeed * 0.65;
  if (Math.abs(diff) > 10) {
    cpuY += Math.sign(diff) * cpuSpd * ds;
    cpuY = Math.max(0, Math.min(H - paddleH, cpuY));
  }

  // Mover bola
  ballX += ballVX * ds;
  ballY += ballVY * ds;

  // Rebote arriba/abajo
  if (ballY - ballR <= 0) { ballY = ballR; ballVY = Math.abs(ballVY); }
  if (ballY + ballR >= H) { ballY = H - ballR; ballVY = -Math.abs(ballVY); }

  // Colisión con paleta jugador (izquierda)
  const pLeft = 30, pRight = pLeft + paddleW;
  if (ballX - ballR <= pRight && ballX + ballR >= pLeft && ballY >= playerY && ballY <= playerY + paddleH && ballVX < 0) {
    ballX = pRight + ballR;
    const hitPos = (ballY - (playerY + paddleH / 2)) / (paddleH / 2);
    ballVX = Math.abs(ballVX) * 1.05;
    ballVY = hitPos * ballBaseSpeed * 1.2;
  }

  // Colisión con paleta CPU (derecha)
  const cLeft = W - 30 - paddleW, cRight = cLeft + paddleW;
  if (ballX + ballR >= cLeft && ballX - ballR <= cRight && ballY >= cpuY && ballY <= cpuY + paddleH && ballVX > 0) {
    ballX = cLeft - ballR;
    const hitPos = (ballY - (cpuY + paddleH / 2)) / (paddleH / 2);
    ballVX = -Math.abs(ballVX) * 1.05;
    ballVY = hitPos * ballBaseSpeed * 1.2;
  }

  // Límites bola (punto)
  if (ballX < -ballR * 2) {
    cpuScore++;
    if (cpuScore >= maxScore) goTo(STATE.GAME_OVER, false);
    else resetBall();
  }
  if (ballX > W + ballR * 2) {
    playerScore++;
    if (playerScore >= maxScore) goTo(STATE.GAME_OVER, true);
    else resetBall();
  }

  drawGameplayScreen();
}

function drawGameplayScreen() {
  ctx.fillStyle = COL_BLACK;
  ctx.fillRect(0, 0, W, H);

  // Línea central punteada
  ctx.strokeStyle = '#333';
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Marcador
  ctx.font = 'bold 64px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COL_WHITE;
  ctx.fillText(playerScore.toString(), W / 2 - 80, 60);
  ctx.fillText(cpuScore.toString(), W / 2 + 80, 60);

  // Paleta jugador (izquierda) — sombra cyan+magenta
  ctx.fillStyle = COL_CYAN;
  ctx.fillRect(31, playerY + 1, paddleW - 2, paddleH);
  ctx.fillStyle = COL_MAG;
  ctx.fillRect(29, playerY - 1, paddleW - 2, paddleH);
  ctx.fillStyle = COL_WHITE;
  ctx.fillRect(30, playerY, paddleW, paddleH);

  // Paleta CPU (derecha) — sombra cyan+magenta
  const cx = W - 30 - paddleW;
  ctx.fillStyle = COL_CYAN;
  ctx.fillRect(cx + 1, cpuY + 1, paddleW - 2, paddleH);
  ctx.fillStyle = COL_MAG;
  ctx.fillRect(cx - 1, cpuY - 1, paddleW - 2, paddleH);
  ctx.fillStyle = COL_WHITE;
  ctx.fillRect(cx, cpuY, paddleW, paddleH);

  // Bola — doble sombra cyan/magenta
  ctx.beginPath();
  ctx.arc(ballX + 3, ballY + 3, ballR, 0, Math.PI * 2);
  ctx.fillStyle = COL_CYAN;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(ballX - 3, ballY - 3, ballR, 0, Math.PI * 2);
  ctx.fillStyle = COL_MAG;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(ballX, ballY, ballR, 0, Math.PI * 2);
  ctx.fillStyle = COL_WHITE;
  ctx.fill();
}

// ── Estado: GAME_OVER ───────────────────────────────
function enterGameOver(fromState, wasWon) { won = wasWon; }
let gameOverTimer = 0;
function updateGameOver(dt) {
  gameOverTimer += dt;
  drawScreen();
}
function drawGameOverScreen() {
  ctx.fillStyle = COL_BLACK;
  ctx.fillRect(0, 0, W, H);

  const text = won ? 'Victory' : 'You Loser';
  // Efecto parpadeo sutil
  if (gameOverTimer < 300) {
    ctx.globalAlpha = gameOverTimer / 300;
  } else if (gameOverTimer > 2500) {
    const t = (gameOverTimer - 2500) / 500;
    ctx.globalAlpha = 1 - t * 0.3; // fade final leve
  }

  drawCenteredMultipleShadows(text, W / 2, H / 2, 64);
  ctx.globalAlpha = 1;

  // Texto "Press ENTER to continue" parpadeando
  if (gameOverTimer > 300) {
    const blinkOn = ((gameOverTimer - 300) % 800) < 400;
    if (blinkOn) drawTextBelow('Presiona ENTER para continuar', W / 2, H / 2 + 80, 20, 1);
  }
}

// ── Bucle principal ─────────────────────────────────
let lastTime = performance.now();

function update(dt) {
  switch (state) {
    case STATE.BOOT:       updateBoot(dt);             break;
    case STATE.MAIN_MENU:  updateMainMenu(dt);         break;
    case STATE.GAMEPLAY:   updateGameplay(dt);         break;
    case STATE.GAME_OVER:  updateGameOver(dt);         break;
  }
}

function drawScreen() {
  switch (state) {
    case STATE.BOOT:       drawBootScreen();            break;
    case STATE.MAIN_MENU:  drawMainMenuScreen();        break;
    case STATE.GAMEPLAY:   drawGameplayScreen();        break;
    case STATE.GAME_OVER:  drawGameOverScreen();        break;
  }
}

function loop(now) {
  const dt = Math.min(now - lastTime, 50); // cap a 50ms
  lastTime = now;
  update(dt);
  requestAnimationFrame(loop);
}

// ── Input ───────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;

  if (e.key === 'Enter') {
    if (state === STATE.GAME_OVER && gameOverTimer > 300) goTo(STATE.MAIN_MENU);
    else if (state === STATE.MAIN_MENU) { prevState = STATE.GAMEPLAY; goTo(STATE.GAMEPLAY); }
  }
});

document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('click', () => {
  if (state === STATE.MAIN_MENU) { prevState = STATE.GAMEPLAY; goTo(STATE.GAMEPLAY); }
});

// ── Iniciar juego en Boot ───────────────────────────
goTo(STATE.BOOT);
requestAnimationFrame(loop);
</script>
</body>
</html>
