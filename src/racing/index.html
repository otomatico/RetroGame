<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <title>NEON / RUSH — Retro Arcade Racing</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">RETRO NEON MINIMAL / 02</p>
        <h1>NEON<span class="dot"> / </span>RUSH</h1>
      </div>
      <div class="top-actions"><span id="status" class="status">READY</span><button id="language" class="small-button"
          type="button" aria-label="Change language">ES / EN</button><button id="sound" class="small-button"
          type="button" aria-label="Toggle sound">SOUND: ON</button></div>
    </header>
    <section class="game-frame" aria-label="Neon Rush racing game"><canvas id="game" width="960" height="600"
        aria-label="Vertical scrolling arcade racing game"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
    </section>
    <footer>
      <div class="help">
        <kbd>A</kbd><kbd>D</kbd><span>STEER</span><i></i><kbd>W</kbd><span>ACCELERATE</span><kbd>S</kbd><span>BRAKE</span>
      </div>
      <div class="help"><kbd>SPACE</kbd><span>NITRO</span><kbd>P</kbd><span>PAUSE</span><kbd>R</kbd><span>MENU</span>
      </div>
    </footer>
    <p class="note">Pure top-down 2D racing: parallel road edges, fixed-size sprites, traffic, power-ups and roadside
      refuelling. Retro Neon Minimal.</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>

</html>
